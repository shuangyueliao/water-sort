<script>
"use strict";
/*==LOGIC-START==*/
// 纯规则逻辑（无 DOM 依赖，游戏与 Node 测试共用）
var WS_CAP = 4; // 每管容量（格）

// 顶部连续同色段：{color, len}；空管返回 null
function topSeg(t) {
  if (!t.length) return null;
  var c = t[t.length - 1], n = 1;
  for (var i = t.length - 2; i >= 0 && t[i] === c; i--) n++;
  return { color: c, len: n };
}
function isUniform(t) {
  for (var i = 1; i < t.length; i++) if (t[i] !== t[0]) return false;
  return true;
}
// 封盖完成：满管且同色（此时锁定不可再倒出）
function isDone(t) { return t.length === WS_CAP && isUniform(t); }

// 倒水合法性判定。返回 {ok, k}，k = min(源顶部连续段长, 目标剩余空间)
// 规则：源非空且未封盖；目标为空或顶部同色且有空位；下标越界/同管非法
function canPour(tubes, a, b) {
  if (!(a >= 0 && a < tubes.length && b >= 0 && b < tubes.length) || a === b) return { ok: false, k: 0 };
  var A = tubes[a], B = tubes[b];
  if (!A.length || isDone(A)) return { ok: false, k: 0 };
  var space = WS_CAP - B.length;
  if (space <= 0) return { ok: false, k: 0 };
  var seg = topSeg(A);
  if (B.length && B[B.length - 1] !== seg.color) return { ok: false, k: 0 };
  return { ok: true, k: Math.min(seg.len, space) };
}
// 执行倒水（先判合法），返回实际倒出格数（不合法返回 0，不改动状态）
function applyPour(tubes, a, b) {
  var r = canPour(tubes, a, b);
  if (!r.ok) return 0;
  for (var i = 0; i < r.k; i++) tubes[b].push(tubes[a].pop());
  return r.k;
}

// ---- 种子随机（mulberry32，保证关卡生成确定性） ----
function mulberry32(seed) {
  var t = seed >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    var x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// 状态规范化键：各管内容串接后排序（管位互换的对称局面视为同一状态）
function canonKey(tubes) {
  var parts = [];
  for (var i = 0; i < tubes.length; i++) parts.push(tubes[i].join(""));
  return parts.sort().join("|");
}
function doneCount(tubes) {
  var n = 0;
  for (var i = 0; i < tubes.length; i++) if (isDone(tubes[i])) n++;
  return n;
}

// ---- 求解器（DFS + 状态去重，用于生成校验；找到的每一步都是合法游戏动作） ----
// 返回 {moves:[{a,b,k}...], nodes} 或 null（超节点上限视为未解出）
function solveWS(tubesIn, colorCount, maxNodes) {
  var tubes = tubesIn.map(function (t) { return t.slice(); });
  var visited = Object.create(null);
  var cap = maxNodes || 300000;
  var nodes = 0;
  var solution = [];
  visited[canonKey(tubes)] = 1;
  function dfs() {
    if (doneCount(tubes) === colorCount) return true;
    if (nodes++ > cap) return false;
    var moves = [], a, b;
    for (a = 0; a < tubes.length; a++) {
      var A = tubes[a];
      if (!A.length || isDone(A)) continue;
      var seg = topSeg(A);
      var uniformAll = A.length === seg.len; // 整管同色（未满）
      for (b = 0; b < tubes.length; b++) {
        if (b === a) continue;
        var B = tubes[b];
        var space = WS_CAP - B.length;
        if (space <= 0) continue;
        if (B.length && B[B.length - 1] !== seg.color) continue;
        if (!B.length && uniformAll) continue; // 剪枝：整管同色挪空管是同构无效动作
        var k = Math.min(seg.len, space);
        moves.push({ a: a, b: b, k: k, s: (B.length ? 2 : 0) + k });
      }
    }
    moves.sort(function (p, q) { return q.s - p.s; }); // 优先同色合并、大口倒
    for (var m = 0; m < moves.length; m++) {
      var mv = moves[m], i;
      for (i = 0; i < mv.k; i++) tubes[mv.b].push(tubes[mv.a].pop());
      var key = canonKey(tubes);
      if (!visited[key]) {
        visited[key] = 1;
        if (dfs()) { solution.push(mv); return true; }
      }
      for (i = 0; i < mv.k; i++) tubes[mv.a].push(tubes[mv.b].pop());
    }
    return false;
  }
  var ok = dfs();
  return ok ? { moves: solution.reverse(), nodes: nodes } : null;
}

// ---- 关卡配置：颜色 3→8、管数 = 颜色数 + 2（空管） ----
function levelConfig(n) {
  var colors = 3 + Math.min(5, Math.floor((n - 1) / 7));
  var steps = Math.min(6 + Math.floor((n - 1) / 2), 25); // 生成打散步数
  return { colors: colors, tubes: colors + 2, steps: steps };
}

// ---- 关卡生成（反向操作法：严格逆倒，天然保证有解）----
// 从完成态（每色一整管 + 2 空管）出发执行 N 步"逆倒"：
//   从管 P 顶部取 k 个同色格，放到任意有空位的管 Q 顶上（Q 允许异色 —— 这正是"埋色"的来源）。
// 每步满足三个约束，使得按生成步逆序回放 = 一局合法游戏动作序列：
//   (1) 回放倒入量恰为 k：Q 顶部原本没有同色段，或 P 原本满管；
//   (2) 回放倒入 P 合法：k < P 顶段长（P 顶仍同色）或 P 恰好被倒空；
//   (3) Q 不会因此变成封盖完成管（否则回放时 Q 被锁定无法倒出）。
// 生成后先做回放验证，再用求解器双重确认；par = 生成步数（回放即一份 par 步的合法解）。
function genLevel(n, seedBase) {
  var cfg = levelConfig(n);
  var base = (seedBase === undefined) ? (n * 7919 + 1013) : seedBase;
  var attempt, c, i;
  for (attempt = 0; attempt < 90; attempt++) {
    var rnd = mulberry32((base + attempt * 104729) >>> 0);
    var effSteps = Math.max(6, cfg.steps - Math.min(5, Math.floor(attempt / 15)) * 2);
    var minSol = attempt < 60 ? Math.max(3, Math.floor(effSteps * 0.5)) : 1;
    var tubes = [];
    for (c = 0; c < cfg.colors; c++) tubes.push([c, c, c, c]);
    tubes.push([], []);
    var lastP = -1, lastQ = -1;
    var moves = [];
    for (var step = 0; step < effSteps; step++) {
      var cands = [];
      for (var p = 0; p < tubes.length; p++) {
        var P = tubes[p];
        if (!P.length) continue;
        var seg = topSeg(P), Lp = seg.len, lenP = P.length;
        for (var k = 1; k <= Lp; k++) {
          if (!(k < Lp || k === lenP)) continue; // (2) 回放倒入 P 的合法性
          for (var q = 0; q < tubes.length; q++) {
            if (q === p || (p === lastQ && q === lastP)) continue; // 避免立刻回倒
            var Q = tubes[q];
            if (WS_CAP - Q.length < k) continue;
            var tq = topSeg(Q);
            var m = (tq && tq.color === seg.color) ? tq.len : 0;
            if (!(m === 0 || lenP === WS_CAP)) continue; // (1) 回放倒出量恰为 k
            if (Q.length - m === 0 && Q.length + k === WS_CAP) continue; // (3) Q 不得被封盖
            if (Q.length === 0 && k === lenP) continue; // 整管挪去空管：无意义
            cands.push({ p: p, q: q, k: k });
          }
        }
      }
      if (!cands.length) break;
      var mv = cands[Math.floor(rnd() * cands.length)];
      for (i = 0; i < mv.k; i++) tubes[mv.q].push(tubes[mv.p].pop());
      moves.push({ from: mv.p, to: mv.q, k: mv.k });
      lastP = mv.p; lastQ = mv.q;
    }
    // 回放验证：逆序执行 (Q→P) 的合法倒水，必须逐步恰量并还原到完成态
    var replay = tubes.map(function (t) { return t.slice(); });
    var okReplay = moves.length > 0;
    for (i = moves.length - 1; i >= 0 && okReplay; i--) {
      if (applyPour(replay, moves[i].to, moves[i].from) !== moves[i].k) okReplay = false;
    }
    if (!okReplay || doneCount(replay) !== cfg.colors) continue;
    // 求解器校验（双重保险）+ 难度门槛（打散不足则换种子重来）
    var sol = solveWS(tubes, cfg.colors, 300000);
    if (!sol || sol.moves.length < minSol) continue;
    return {
      tubes: tubes, colors: cfg.colors, par: moves.length, applied: moves.length,
      replayMoves: moves.slice().reverse(), solLen: sol.moves.length,
      seed: (base + attempt * 104729) >>> 0
    };
  }
  // 理论上到不了这里（兜底：轻微打散局，可解）
  var fb = [], d;
  for (d = 0; d < cfg.colors; d++) fb.push([d, d, d, d]);
  fb.push([], []);
  var t0 = fb[0].pop(); fb[cfg.colors].push(t0);
  return {
    tubes: fb, colors: cfg.colors, par: 1, applied: 1,
    replayMoves: [{ from: 0, to: cfg.colors, k: 1 }], solLen: 1, seed: base >>> 0
  };
}
/*==LOGIC-END==*/
</script>

<script>
"use strict";
// ================= 游戏部分（DOM / 渲染 / 输入 / 音效） =================

// ---------- 常量 ----------
var W = 480, H = 440;
var TUBE_W = 54, TUBE_H = 156, PITCH = 76;
var SEG_H = (TUBE_H - 26) / 4; // 每格液高
var PALETTE = ["#e5484d", "#3d7bf0", "#2fa96e", "#f0b429", "#8f5bdb", "#ef7f2f", "#23b5c2", "#e56ba3"];
var MAX_LEVEL = 40;

// ---------- 进度（localStorage，全部 try/catch） ----------
var progress = { unlocked: 1, best: {}, stars: {}, muted: false, sfxVol: 0.9, musicVol: 0.6 };
function loadProgress() {
  try {
    var raw = localStorage.getItem("ws_v1");
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p === "object") {
        progress.unlocked = Math.max(1, Math.min(MAX_LEVEL, parseInt(p.unlocked, 10) || 1));
        progress.best = (p.best && typeof p.best === "object") ? p.best : {};
        progress.stars = (p.stars && typeof p.stars === "object") ? p.stars : {};
        progress.muted = !!p.muted;
        if (typeof p.sfxVol === "number") progress.sfxVol = Math.max(0, Math.min(1, p.sfxVol));
        if (typeof p.musicVol === "number") progress.musicVol = Math.max(0, Math.min(1, p.musicVol));
      }
    }
  } catch (e) {}
}
function saveProgress() {
  try { localStorage.setItem("ws_v1", JSON.stringify(progress)); } catch (e) {}
}

// ---------- 音效（WebAudio 合成） ----------
var actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function tone(f0, f1, dur, type, gainv, when) {
  try {
    if (progress.muted || window.__gmForceMute) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + (when || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(Math.max(1, f0), t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime((gainv || 0.1) * (progress.sfxVol != null ? progress.sfxVol : 0.9), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
var SFX = {
  select: function () { tone(430, 520, 0.06, "sine", 0.06); },
  click:  function () { tone(360, 360, 0.045, "sine", 0.05); },
  deny:   function () { tone(150, 92, 0.13, "sawtooth", 0.06); },
  undo:   function () { tone(300, 220, 0.09, "sine", 0.06); },
  // 倒水咕嘟声：一串随机音高的短水泡 + 低频下滑
  pour: function (k) {
    var n = 3 + Math.min(4, k);
    for (var i = 0; i < n; i++) {
      var f = 340 + Math.random() * 320;
      tone(f, f * 1.55, 0.055, "sine", 0.065, i * 0.055);
    }
    tone(210, 95, 0.24, "sine", 0.055, 0.02);
  },
  // 封盖：金属叮一声（基音 + 泛音）
  cap: function () {
    tone(880, 860, 0.14, "triangle", 0.11);
    tone(1318, 1300, 0.10, "sine", 0.05, 0.015);
  },
  win: function () {
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i < notes.length; i++) {
      (function (f, k) { tone(f, f, 0.18, "triangle", 0.10, k * 0.115); })(notes[i], i);
    }
  }
};

// ---------- 平台埋点（SDK 已做域名守卫，其他域为空操作） ----------
function cgStart() { try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStart(); } catch (e) {} }
function cgStop()  { try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStop(); } catch (e) {} }
function cgHappy() { try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.happytime(); } catch (e) {} }

// ---------- 画布与自适应 ----------
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
function fit() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var hud = document.getElementById("hud"), btns = document.getElementById("btnRow"), foot = document.getElementById("gfooter");
  var chrome = (hud ? hud.offsetHeight : 0) + (btns ? btns.offsetHeight : 0) + (foot ? foot.offsetHeight : 0) + 30;
  var availW = Math.min(window.innerWidth - 16, 560);
  var availH = window.innerHeight - chrome;
  var s = Math.min(availW / W, availH / H);
  if (!isFinite(s) || s <= 0) s = 1;
  s = Math.min(s, 1.25);
  canvas.style.width = Math.round(W * s) + "px";
  canvas.style.height = Math.round(H * s) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);

function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16);
  var r = Math.max(0, Math.min(255, (n >> 16) + Math.round(255 * amt)));
  var g = Math.max(0, Math.min(255, ((n >> 8) & 255) + Math.round(255 * amt)));
  var b = Math.max(0, Math.min(255, (n & 255) + Math.round(255 * amt)));
  return "rgb(" + r + "," + g + "," + b + ")";
}
function roundRect(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

// ---------- 游戏状态 ----------
var screenName = "select"; // select | game
var phase = "PLAY";        // PLAY | WIN
var tubes = [];            // 逻辑状态：tubes[i] = 自底向上的颜色序号数组
var initialTubes = [];
var colors = 3, par = 6, moves = 0, levelNum = 1;
var plusOneUsed = false;
var undoStack = [];        // 每步保存整局快照（无限撤销）
var selected = -1;         // 被举起待倒的管
var anim = null;           // 倒水动画（同一时间只有一个，防止叠加）
var caps = {};             // 完成封盖动画：管下标 -> {t}
var particles = [];        // 水滴 / 闪光 / 彩纸
var shake = null;          // {tube, t} 拒绝晃动
var kbCursor = -1;         // 键盘光标
var winToken = 0;
var pos = [];              // 每管屏幕位置 {x, by}（x 中心，by 管底）

// ---------- 布局 ----------
function layoutTubes(total) {
  pos = [];
  var oneRow = total <= 5;
  var rows = oneRow ? 1 : 2;
  var bottom = oneRow ? total : Math.ceil(total / 2);
  var top = total - bottom;
  var r, count, by;
  for (r = 0; r < rows; r++) {
    count = r === 0 ? bottom : top;
    if (count <= 0) continue;
    var rowW = count * PITCH - (PITCH - TUBE_W);
    var x0 = (W - rowW) / 2 + TUBE_W / 2;
    if (oneRow) by = H / 2 + TUBE_H / 2 + 6;
    else by = (r === 0) ? H - 38 : H - 38 - TUBE_H - 44;
    for (var i = 0; i < count; i++) pos.push({ x: x0 + i * PITCH, by: by });
  }
  // 上排排在前面的位置上：pos 顺序 = 管下标顺序（下排先入）
}

// ---------- 流程 ----------
function startLevel(n) {
  levelNum = n;
  var g = genLevel(n);
  colors = g.colors; par = g.par;
  tubes = g.tubes.map(function (t) { return t.slice(); });
  initialTubes = tubes.map(function (t) { return t.slice(); });
  moves = 0; plusOneUsed = false;
  undoStack = []; selected = -1; anim = null; caps = {};
  particles = []; shake = null; kbCursor = -1;
  phase = "PLAY";
  screenName = "game";
  layoutTubes(tubes.length);
  setScreen("game");
  document.getElementById("lvTitle").textContent = "第 " + n + " 关";
  hideOverlay();
  updateHud();
  cgStart();
  try { if (typeof sdk !== "undefined" && sdk.showBanner) sdk.showBanner(); } catch (e) {}
}
function restartLevel() {
  if (screenName !== "game") return;
  tubes = initialTubes.map(function (t) { return t.slice(); });
  moves = 0; plusOneUsed = false;
  undoStack = []; selected = -1; anim = null; caps = {};
  particles = []; shake = null; kbCursor = -1;
  phase = "PLAY";
  layoutTubes(tubes.length);
  hideOverlay();
  updateHud();
  SFX.click();
  cgStart();
  try { if (typeof sdk !== "undefined" && sdk.showBanner) sdk.showBanner(); } catch (e) {}
}
function updateHud() {
  document.getElementById("stMoves").textContent = moves;
  document.getElementById("stPar").textContent = par;
  var b = progress.best[levelNum];
  document.getElementById("stBest").textContent = b ? b : "\u2014";
  document.getElementById("btnUndo").disabled = undoStack.length === 0 || phase !== "PLAY";
  var bp = document.getElementById("btnPlus");
  bp.disabled = plusOneUsed || phase !== "PLAY";
  bp.innerHTML = plusOneUsed ? "TUBE +1 &#10003;" : "TUBE +1";
}
function undo() {
  if (screenName !== "game" || phase !== "PLAY" || anim || !undoStack.length) return;
  tubes = undoStack.pop();
  moves--;
  selected = -1; kbCursor = -1; shake = null;
  syncCaps(true);
  SFX.undo();
  updateHud();
}
function usePlus() {
  if (screenName !== "game" || phase !== "PLAY" || anim || plusOneUsed) return;
  tubes.push([]);
  plusOneUsed = true;
  selected = -1;
  layoutTubes(tubes.length);
  SFX.select();
  updateHud();
}
// 同步封盖动画状态；silent=true 不播放音效/闪光（undo 后）
function syncCaps(silent) {
  for (var i = 0; i < tubes.length; i++) {
    var done = isDone(tubes[i]);
    if (done && !caps[i]) caps[i] = { t: silent ? 1 : 0, fresh: !silent };
    if (!done && caps[i]) delete caps[i];
  }
}
function doPour(a, b, k) {
  undoStack.push(tubes.map(function (t) { return t.slice(); }));
  if (undoStack.length > 400) undoStack.shift();
  moves++;
  var preA = tubes[a].length, preB = tubes[b].length;
  applyPour(tubes, a, b);
  var color = topSeg(tubes[b]).color;
  anim = {
    a: a, b: b, k: k, color: color,
    preA: preA, postA: tubes[a].length, preB: preB, postB: tubes[b].length,
    t: 0,
    phases: [
      { name: "lift", d: 0.13 }, { name: "tilt", d: 0.10 },
      { name: "pour", d: 0.20 + k * 0.07 }, { name: "untilt", d: 0.10 },
      { name: "settle", d: 0.12 }
    ],
    soundPlayed: false
  };
  var tt = 0; for (var p = 0; p < anim.phases.length; p++) tt += anim.phases[p].d;
  anim.total = tt;
  selected = -1; kbCursor = -1;
  updateHud();
}
function afterPour() {
  // 封盖闪光 + 音效
  var before = 0, i;
  for (i = 0; i < tubes.length; i++) if (isDone(tubes[i])) before++;
  syncCaps(false);
  var fresh = [], delay = 0;
  for (i = 0; i < tubes.length; i++) {
    if (caps[i] && caps[i].fresh) {
      fresh.push(i);
      caps[i].fresh = false;
    }
  }
  for (i = 0; i < fresh.length; i++) {
    (function (idx, dl) {
      spawnSparkle(idx, dl);
      (function () { setTimeout(function () { SFX.cap(); }, Math.round(dl * 1000)); })();
    })(fresh[i], delay);
    delay += 0.14;
  }
  // 过关判定
  if (before >= colors) {
    phase = "WIN";
    try { if (typeof sdk !== "undefined" && sdk.showBanner) sdk.showBanner(); } catch (e) {}
    winToken++;
    SFX.win();
    cgStop(); cgHappy();
    var stars = moves <= par ? 3 : (moves <= par * 2 ? 2 : 1);
    var prevBest = progress.best[levelNum] || 0;
    var isNewBest = !prevBest || moves < prevBest;
    if (isNewBest) progress.best[levelNum] = moves;
    if (!progress.stars[levelNum] || stars > progress.stars[levelNum]) progress.stars[levelNum] = stars;
    if (levelNum < MAX_LEVEL && progress.unlocked < levelNum + 1) progress.unlocked = levelNum + 1;
    saveProgress();
    spawnConfetti();
    var token = winToken;
    setTimeout(function () {
      if (screenName === "game" && phase === "WIN" && token === winToken) showWinPanel(stars, isNewBest);
    }, 900);
  }
}
function showWinPanel(stars, isNewBest) {
  var html = "";
  for (var s = 1; s <= 3; s++) html += '<span class="' + (s <= stars ? "on" : "off") + '">&#9733;</span>';
  document.getElementById("ovStars").innerHTML = html;
  document.getElementById("ovNew").textContent = isNewBest ? "新纪录！" : "";
  var title = document.getElementById("ovTitle");
  if (levelNum >= MAX_LEVEL) title.textContent = "全部通关！";
  else title.textContent = "过关！";
  var b = progress.best[levelNum];
  document.getElementById("ovText").innerHTML =
    "步数 <b>" + moves + "</b> &nbsp;&#183;&nbsp; 目标 <b>" + par + "</b>" +
    (b ? " &nbsp;&#183;&nbsp; Best: <b>" + b + "</b>" : "");
  var nextBtn = document.getElementById("btnNext");
  if (levelNum >= MAX_LEVEL) nextBtn.classList.add("hide");
  else nextBtn.classList.remove("hide");
  document.getElementById("overlay").style.display = "flex";
  updateHud();
}
function hideOverlay() { document.getElementById("overlay").style.display = "none"; }
function nextLevel() { if (levelNum < MAX_LEVEL) startLevel(levelNum + 1); }
function goSelect() {
  screenName = "select";
  phase = "PLAY";
  anim = null; selected = -1;
  setScreen("select");
  buildGrid();
  cgStop();
}
function setScreen(name) {
  document.getElementById("scrSelect").classList.toggle("active", name === "select");
  document.getElementById("scrGame").classList.toggle("active", name === "game");
  if (name === "game") fit();
}

// ---------- 关卡卡片 ----------
var LOCK_SVG = '<svg class="locksvg" width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2.5" fill="#b6c5d8"/><path d="M8 10V7.5A4 4 0 0 1 16 7.5V10" stroke="#b6c5d8" stroke-width="2.6" fill="none"/><circle cx="12" cy="15" r="1.7" fill="#eef3f9"/></svg>';
function buildGrid() {
  var html = "";
  for (var n = 1; n <= MAX_LEVEL; n++) {
    var unlocked = n <= progress.unlocked;
    var st = progress.stars[n] || 0;
    var bm = progress.best[n];
    if (unlocked) {
      var stars = "";
      for (var s = 1; s <= 3; s++) stars += '<span class="' + (s <= st ? "on" : "off") + '">&#9733;</span>';
      html += '<button class="card" data-n="' + n + '">' +
        '<div class="num">' + n + '</div>' +
        '<div class="stars">' + stars + '</div>' +
        '<div class="bm">' + (bm ? "BEST " + bm : "&#8212;") + '</div></button>';
    } else {
      html += '<button class="card locked" disabled>' + LOCK_SVG +
        '<div class="num dim">' + n + '</div></button>';
    }
  }
  document.getElementById("lvGrid").innerHTML = html;
}
document.getElementById("lvGrid").addEventListener("click", function (e) {
  var el = e.target;
  while (el && el !== this && !(el.classList && el.classList.contains("card"))) el = el.parentNode;
  if (!el || el === this || !el.dataset) return;
  var n = parseInt(el.getAttribute("data-n"), 10);
  if (!n || n > progress.unlocked) return;
  ensureAudio(); SFX.click();
  startLevel(n);
});

// ---------- 声音开关 ----------
function updateMuteLabels() {
  var on = !progress.muted;
  document.getElementById("btnMute1").textContent = on ? "音效: 开" : "音效: 关";
  document.getElementById("btnMute2").textContent = on ? "开" : "关";
}
function toggleMute() {
  progress.muted = !progress.muted;
  saveProgress();
  updateMuteLabels();
  applyVolumes();
  if (!progress.muted) {
    ensureAudio(); SFX.click();
    if (bgmEl && bgmStarted && (progress.musicVol || 0) > 0) { var p = bgmEl.play(); if (p && p.catch) p.catch(function () {}); }
  }
}
document.getElementById("btnMute1").addEventListener("click", toggleMute);
document.getElementById("btnMute2").addEventListener("click", toggleMute);

// ---------- 设置 / 玩法说明 / 背景音乐（GM 质量标准） ----------
var bgmEl = document.getElementById("bgm");
var bgmStarted = false;
function applyVolumes() {
  var mv = progress.muted ? 0 : (typeof progress.musicVol === "number" ? progress.musicVol : 0.6);
  if (bgmEl) bgmEl.volume = Math.max(0, Math.min(1, mv * 0.55));
  if (progress.muted && bgmEl && !bgmEl.paused) bgmEl.pause();
  var rgM = document.getElementById("rgMusic"), rgS = document.getElementById("rgSfx");
  if (rgM) { rgM.value = Math.round((progress.musicVol || 0) * 100); document.getElementById("vMusic").textContent = rgM.value; }
  if (rgS) { rgS.value = Math.round((progress.sfxVol == null ? 0.9 : progress.sfxVol) * 100); document.getElementById("vSfx").textContent = rgS.value; }
}
function startBgm() {
  if (bgmStarted || !bgmEl) return;
  bgmStarted = true;
  applyVolumes();
  if (!progress.muted && (progress.musicVol || 0) > 0) {
    var p = bgmEl.play(); if (p && p.catch) p.catch(function () {});
  }
}
window.addEventListener("pointerdown", startBgm, { once: true });
window.addEventListener("keydown", startBgm, { once: true });

function openModal(id) { var el = document.getElementById(id); if (el) el.classList.add("open"); }
function closeModal(id) { var el = document.getElementById(id); if (el) el.classList.remove("open"); }
function bindTap(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", function (e) { e.stopPropagation(); fn(); }); }
bindTap("btnSettings1", function () { applyVolumes(); openModal("mSettings"); ensureAudio(); SFX.click(); });
bindTap("btnSettings2", function () { applyVolumes(); openModal("mSettings"); ensureAudio(); SFX.click(); });
bindTap("btnInfo1", function () { openModal("mInfo"); SFX.click(); });
bindTap("btnCloseSettings", function () { closeModal("mSettings"); SFX.click(); });
bindTap("btnCloseInfo", function () { closeModal("mInfo"); SFX.click(); });
bindTap("btnHowPlay", function () { closeModal("mSettings"); openModal("mInfo"); SFX.click(); });
bindTap("btnReset", function () {
  progress.unlocked = 1; progress.best = {}; progress.stars = {};
  saveProgress(); buildGrid(); closeModal("mSettings"); ensureAudio(); SFX.undo();
});
(function () {
  var rgM = document.getElementById("rgMusic");
  if (rgM) rgM.addEventListener("input", function () {
    progress.musicVol = this.value / 100;
    document.getElementById("vMusic").textContent = this.value;
    if (progress.muted && this.value > 0) { progress.muted = false; updateMuteLabels(); }
    saveProgress(); applyVolumes();
    if (bgmEl && bgmEl.paused && !progress.muted && progress.musicVol > 0) { var p = bgmEl.play(); if (p && p.catch) p.catch(function () {}); }
  });
  var rgS = document.getElementById("rgSfx");
  if (rgS) rgS.addEventListener("input", function () {
    progress.sfxVol = this.value / 100;
    document.getElementById("vSfx").textContent = this.value;
    if (progress.muted && this.value > 0) { progress.muted = false; updateMuteLabels(); }
    saveProgress(); applyVolumes(); ensureAudio(); SFX.click();
  });
})();
// 广告静音钩子（由 SDK onEvent 调用）：广告期间暂停 BGM，结束后按用户设置恢复
window.__wsApplyAdMute = function (on) {
  if (on) { if (bgmEl && !bgmEl.paused) bgmEl.pause(); return; }
  loadProgress(); updateMuteLabels(); applyVolumes();
  if (bgmEl && bgmStarted && !progress.muted && (progress.musicVol || 0) > 0) {
    var p = bgmEl.play(); if (p && p.catch) p.catch(function () {});
  }
};

// ---------- 特效粒子 ----------
function spawnDroplets(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    particles.push({
      kind: "drop", x: x + (Math.random() * 10 - 5), y: y,
      vx: (Math.random() * 2 - 1) * 46, vy: -60 - Math.random() * 90,
      life: 0.45 + Math.random() * 0.2, max: 0.6, color: color, size: 2 + Math.random() * 2.6
    });
  }
}
function spawnSparkle(idx, delay) {
  var p = pos[idx];
  if (!p) return;
  for (var i = 0; i < 14; i++) {
    var a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 110;
    particles.push({
      kind: "spark", x: p.x + (Math.random() * 20 - 10), y: p.by - TUBE_H + Math.random() * 30,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50,
      life: 0.5 + delay + Math.random() * 0.25, max: 0.75,
      color: "#ffffff", size: 1.5 + Math.random() * 2.5, wait: delay
    });
  }
}
function spawnConfetti() {
  for (var i = 0; i < 70; i++) {
    particles.push({
      kind: "conf", x: Math.random() * W, y: -10 - Math.random() * 60,
      vx: (Math.random() * 2 - 1) * 40, vy: 60 + Math.random() * 120,
      life: 2.2 + Math.random(), max: 3.2,
      color: PALETTE[i % PALETTE.length], size: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI, vr: (Math.random() * 2 - 1) * 6
    });
  }
}

// ---------- 渲染 ----------
function tubeTop(p, lift) { return p.by - TUBE_H - (lift || 0); }

// 画一支管：cx 中心 x，byY 管底 y；fill 显示液面（浮点格数）；
// layers 自底向上的完整层颜色；partial {color, extra} 顶部浮动层；
// opts {angle, lift, glow, done, capT}
function drawTubeAt(cx, byY, layers, partial, opts) {
  opts = opts || {};
  var dy = opts.dy || 0;
  var ang = opts.angle || 0;
  ctx.save();
  ctx.translate(cx, byY + dy);
  if (ang) ctx.rotate(ang);
  var x = -TUBE_W / 2, y = -TUBE_H, w = TUBE_W, h = TUBE_H;
  var innerX = -TUBE_W / 2 + 5, innerW = TUBE_W - 10;
  // 选中辉光
  if (opts.glow) {
    ctx.shadowColor = "rgba(47,111,232,.45)";
    ctx.shadowBlur = 20;
  }
  // 玻璃底
  var glass = ctx.createLinearGradient(0, y, 0, 0);
  glass.addColorStop(0, "rgba(255,255,255,.42)");
  glass.addColorStop(1, "rgba(210,224,240,.30)");
  roundRect(ctx, x, y, w, h, 12);
  ctx.fillStyle = glass; ctx.fill();
  ctx.shadowBlur = 0;
  // 液体（裁剪进管内）
  ctx.save();
  roundRect(ctx, x, y, w, h, 12);
  ctx.clip();
  var fillTop = -5 - (opts.fill * SEG_H); // 液面 y（自管底向上）
  var colr = opts.gray ? "#93a0ae" : null;
  // 完整层
  var li;
  for (li = 0; li < layers.length; li++) {
    var yBot = -5 - li * SEG_H, yTopL = yBot - SEG_H;
    var cc = colr || PALETTE[layers[li]] || "#999";
    var g2 = ctx.createLinearGradient(0, yTopL, 0, yBot);
    g2.addColorStop(0, shade(colr ? "#93a0ae" : cc, 0.14));
    g2.addColorStop(1, shade(colr ? "#93a0ae" : cc, -0.10));
    ctx.fillStyle = g2;
    ctx.fillRect(innerX, yTopL, innerW, SEG_H + 0.6);
  }
  // 顶部浮动层（倒水动画的液面插值）
  if (partial && partial.extra > 0.001) {
    var whole = Math.floor(partial.extra), fr = partial.extra - whole;
    for (li = 0; li < whole; li++) {
      var yB2 = -5 - (layers.length + li) * SEG_H;
      var c2 = opts.gray ? "#93a0ae" : PALETTE[partial.color];
      ctx.fillStyle = shade(c2, -0.02);
      ctx.fillRect(innerX, yB2 - SEG_H, innerW, SEG_H + 0.6);
    }
    if (fr > 0.001) {
      var yB3 = -5 - (layers.length + whole) * SEG_H;
      var c3 = opts.gray ? "#93a0ae" : PALETTE[partial.color];
      var g3 = ctx.createLinearGradient(0, yB3 - SEG_H * fr, 0, yB3);
      g3.addColorStop(0, shade(c3, 0.18));
      g3.addColorStop(1, shade(c3, -0.05));
      ctx.fillStyle = g3;
      ctx.fillRect(innerX, yB3 - SEG_H * fr, innerW, SEG_H * fr + 0.6);
    }
  }
  // 液面高光
  if (opts.fill > 0.05) {
    ctx.fillStyle = "rgba(255,255,255,.38)";
    ctx.fillRect(innerX, fillTop, innerW, 3);
  }
  // 玻璃左右高光条
  var hl = ctx.createLinearGradient(x, 0, x + w, 0);
  hl.addColorStop(0, "rgba(255,255,255,.55)");
  hl.addColorStop(0.25, "rgba(255,255,255,.10)");
  hl.addColorStop(0.8, "rgba(255,255,255,.05)");
  hl.addColorStop(1, "rgba(255,255,255,.30)");
  ctx.fillStyle = hl;
  ctx.fillRect(x + 1.5, y + 2, w - 3, h - 4);
  ctx.restore();
  // 封盖（完成后滑落）
  if (opts.done && opts.capT > 0) {
    var ct = Math.min(1, opts.capT);
    var lidY = y - 20 + ct * 16;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.65 * ct;
    var lg = ctx.createLinearGradient(0, lidY, 0, lidY + 13);
    lg.addColorStop(0, "#5d6b7d");
    lg.addColorStop(1, "#3c4857");
    roundRect(ctx, x - 5, lidY, w + 10, 13, 6);
    ctx.fillStyle = lg; ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.30)";
    ctx.fillRect(x - 3, lidY + 2, w + 6, 2.5);
    ctx.restore();
  }
  // 管口沿与描边
  roundRect(ctx, x, y, w, h, 12);
  ctx.strokeStyle = "rgba(96,118,148,.55)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.65)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 5, y + 1.5);
  ctx.lineTo(x + w - 5, y + 1.5);
  ctx.stroke();
  ctx.restore();
}

function animPhaseAt(t) {
  var acc = 0;
  for (var i = 0; i < anim.phases.length; i++) {
    acc += anim.phases[i].d;
    if (t < acc) return { name: anim.phases[i].name, p: (t - (acc - anim.phases[i].d)) / anim.phases[i].d };
  }
  return { name: "end", p: 1 };
}
function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

function drawScene(dt) {
  // 背景
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#f4f7fb");
  bg.addColorStop(1, "#e2eaf3");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // 柔和装饰光斑
  var blob1 = ctx.createRadialGradient(110, 90, 10, 110, 90, 190);
  blob1.addColorStop(0, "rgba(61,123,240,.06)");
  blob1.addColorStop(1, "rgba(61,123,240,0)");
  ctx.fillStyle = blob1; ctx.fillRect(0, 0, W, H);
  var blob2 = ctx.createRadialGradient(400, 330, 10, 400, 330, 200);
  blob2.addColorStop(0, "rgba(47,169,110,.07)");
  blob2.addColorStop(1, "rgba(47,169,110,0)");
  ctx.fillStyle = blob2; ctx.fillRect(0, 0, W, H);

  var ap = anim ? animPhaseAt(anim.t) : null;
  var pourP = 0;
  if (ap && ap.name === "pour") pourP = easeInOut(Math.min(1, ap.p));

  // 每管显示数据
  var i, p;
  var display = [];
  for (i = 0; i < tubes.length; i++) {
    display[i] = { layers: tubes[i], fill: tubes[i].length, partial: null, dy: 0, angle: 0, glow: false };
  }
  if (selected >= 0 && display[selected]) { display[selected].dy = -16; display[selected].glow = true; }
  if (anim) {
    var a = anim.a, b = anim.b;
    var dir = (pos[b].x >= pos[a].x) ? 1 : -1; // 倾倒方向（决定倾角符号）
    // 源管液面
    var srcFill;
    if (ap.name === "pour") srcFill = anim.preA - (anim.preA - anim.postA) * pourP;
    else if (ap.name === "lift" || ap.name === "tilt") srcFill = anim.preA;
    else srcFill = anim.postA;
    display[a] = {
      layers: tubes[a], fill: srcFill,
      partial: { color: anim.color, extra: srcFill - anim.postA },
      dy: 0, angle: 0, glow: false, src: true
    };
    // 目标管液面（完整层只画倒入前的层，倒入部分由 partial 画出）
    var dstFill;
    if (ap.name === "pour") dstFill = anim.preB + (anim.postB - anim.preB) * pourP;
    else if (ap.name === "untilt" || ap.name === "settle" || ap.name === "end") dstFill = anim.postB;
    else dstFill = anim.preB;
    display[b] = {
      layers: tubes[b].slice(0, anim.preB), fill: dstFill,
      partial: { color: anim.color, extra: dstFill - anim.preB },
      dy: 0, angle: 0, glow: false
    };
    // 源管举升与倾角
    if (ap.name === "lift") display[a].dy = -16 * easeInOut(ap.p);
    if (ap.name === "tilt") { display[a].dy = -16; display[a].angle = dir * 34 * Math.PI / 180 * easeInOut(ap.p); }
    if (ap.name === "pour") { display[a].dy = -16; display[a].angle = dir * 34 * Math.PI / 180; }
    if (ap.name === "untilt") { display[a].dy = -16; display[a].angle = dir * 34 * Math.PI / 180 * (1 - easeInOut(ap.p)); }
    if (ap.name === "settle") display[a].dy = -16 * (1 - easeInOut(ap.p));
  }

  // 地面阴影
  for (i = 0; i < tubes.length; i++) {
    if (anim && i === anim.a && (ap.name === "tilt" || ap.name === "pour" || ap.name === "untilt")) continue;
    p = pos[i];
    var sh = ctx.createRadialGradient(p.x, p.by + 6, 2, p.x, p.by + 6, TUBE_W * 0.72);
    sh.addColorStop(0, "rgba(96,118,150,.22)");
    sh.addColorStop(1, "rgba(96,118,150,0)");
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.ellipse(p.x, p.by + 7, TUBE_W * 0.72, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 键盘光标（虚线框）
  if (kbCursor >= 0 && kbCursor < pos.length && kbCursor !== selected) {
    p = pos[kbCursor];
    ctx.save();
    ctx.strokeStyle = "rgba(47,111,232,.55)";
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.6;
    roundRect(ctx, p.x - TUBE_W / 2 - 7, p.by - TUBE_H - 7, TUBE_W + 14, TUBE_H + 14, 15);
    ctx.stroke();
    ctx.restore();
  }

  // 倒水流（先画，管体压在上面边缘）
  if (anim && ap.name === "pour") {
    var ps = pos[anim.a], pd = pos[anim.b];
    var dirS = (pd.x >= ps.x) ? 1 : -1;
    var angS = dirS * 34 * Math.PI / 180;
    var lx = dirS * (TUBE_W / 2 - 8), ly = -TUBE_H + 10;
    var mx = ps.x + lx * Math.cos(angS) - ly * Math.sin(angS);
    var my = ps.by - 16 + lx * Math.sin(angS) + ly * Math.cos(angS);
    var destTopY = pd.by - 5 - display[anim.b].fill * SEG_H;
    var col = PALETTE[anim.color];
    ctx.save();
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 9;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(mx, my);
    var midY = my + (destTopY - my) * 0.45;
    ctx.quadraticCurveTo(pd.x - dirS * 6, midY, pd.x, destTopY);
    ctx.stroke();
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(mx + dirS * 1.5, my + 2);
    ctx.quadraticCurveTo(pd.x - dirS * 5, midY, pd.x - 1, destTopY);
    ctx.stroke();
    ctx.restore();
    if (Math.random() < 0.75) spawnDroplets(pd.x, destTopY, col, 1);
  }

  // 管体（源管最后画，压在其他管之上）
  var order = [];
  for (i = 0; i < tubes.length; i++) order.push(i);
  if (anim) {
    order = order.filter(function (ix) { return ix !== anim.a; });
    order.push(anim.a);
  }
  for (var oi = 0; oi < order.length; oi++) {
    i = order[oi];
    var d = display[i];
    p = pos[i];
    var sx = p.x;
    if (shake && shake.tube === i && shake.t > 0) sx += Math.sin(shake.t * 46) * 4.2 * (shake.t / 0.26);
    drawTubeAt(sx, p.by, d.layers, d.partial, {
      fill: d.fill, angle: d.angle, dy: d.dy, glow: d.glow,
      done: isDone(tubes[i]), capT: caps[i] ? caps[i].t : 0, gray: isDone(tubes[i])
    });
  }

  // 粒子
  for (i = particles.length - 1; i >= 0; i--) {
    var pt = particles[i];
    if (pt.wait > 0) { pt.wait -= dt; continue; }
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    if (pt.kind === "conf") {
      pt.vy += 60 * dt; pt.rot += pt.vr * dt;
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life / 1.2));
      ctx.fillStyle = pt.color;
      ctx.fillRect(-pt.size, -pt.size / 2, pt.size * 2, pt.size);
      ctx.restore();
    } else {
      if (pt.kind === "drop") pt.vy += 480 * dt;
      if (pt.kind === "spark") pt.vy += 140 * dt;
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 底部提示
  if (screenName === "game" && phase === "PLAY" && moves === 0 && !anim) {
    ctx.fillStyle = "rgba(42,52,66,.5)";
    ctx.font = "600 13px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("点一根试管，再点要倒入的地方", W / 2, H - 14);
  }
}

var last = 0;
function frame(t) {
  var dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  if (screenName === "game") {
    if (anim) {
      anim.t += dt;
      var ap = animPhaseAt(anim.t);
      if (ap.name === "pour" && !anim.soundPlayed) { anim.soundPlayed = true; SFX.pour(anim.k); }
      if (anim.t >= anim.total) {
        var fin = anim;
        anim = null;
        // 目标管落地水花
        spawnDroplets(pos[fin.b].x, pos[fin.b].by - 5 - tubes[fin.b].length * SEG_H, PALETTE[fin.color], 4);
        afterPour();
      }
    }
    if (shake) { shake.t -= dt; if (shake.t <= 0) shake = null; }
    // 封盖下滑动画推进
    for (var key in caps) {
      var c = caps[key];
      if (c.t < 1) c.t = Math.min(1, c.t + dt / 0.35);
    }
    drawScene(dt);
  }
  requestAnimationFrame(frame);
}

// ---------- 输入 ----------
function tubeAtPoint(cx, cy) {
  var rect = canvas.getBoundingClientRect();
  var x = (cx - rect.left) / rect.width * W;
  var y = (cy - rect.top) / rect.height * H;
  var bestI = -1, bestD = 1e9;
  for (var i = 0; i < pos.length; i++) {
    var p = pos[i];
    var dx = Math.max(0, Math.abs(x - p.x) - TUBE_W / 2);
    var dy = Math.max(0, (y < p.by - TUBE_H ? p.by - TUBE_H - y : (y > p.by ? y - p.by : 0)));
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; bestI = i; }
  }
  return bestD <= 26 ? bestI : -1;
}
function onTapTube(i) {
  if (screenName !== "game" || phase !== "PLAY" || anim || i < 0 || i >= tubes.length) return;
  if (selected === -1) {
    if (tubes[i].length && !isDone(tubes[i])) {
      selected = i;
      SFX.select();
    } else {
      SFX.click();
    }
    return;
  }
  if (selected === i) { selected = -1; SFX.click(); return; }
  var r = canPour(tubes, selected, i);
  if (r.ok) {
    doPour(selected, i, r.k);
  } else if (tubes[i].length && !isDone(tubes[i])) {
    // 换选另一支可倒的管
    selected = i;
    SFX.select();
  } else {
    shake = { tube: i, t: 0.26 };
    SFX.deny();
  }
}
canvas.addEventListener("mousedown", function (e) { ensureAudio(); kbCursor = -1; onTapTube(tubeAtPoint(e.clientX, e.clientY)); });
canvas.addEventListener("touchstart", function (e) {
  e.preventDefault();
  ensureAudio();
  if (e.touches.length === 1) { kbCursor = -1; onTapTube(tubeAtPoint(e.touches[0].clientX, e.touches[0].clientY)); }
}, { passive: false });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

// 键盘（桌面）：方向键移动光标，Enter/Space 选中或倾倒，Z/U 撤销，R 重开，M 静音，Esc 返回
document.addEventListener("keydown", function (e) {
  if (screenName === "select") return;
  if (phase === "WIN") {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextLevel(); }
    return;
  }
  var k = e.key.toLowerCase();
  if (k === "escape") { goSelect(); return; }
  if (k === "z" || k === "u") { undo(); return; }
  if (k === "r") { restartLevel(); return; }
  if (k === "m") { toggleMute(); return; }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    if (!tubes.length) return;
    var step = (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 1;
    kbCursor = kbCursor < 0 ? 0 : (kbCursor + step + tubes.length) % tubes.length;
    return;
  }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (kbCursor >= 0) onTapTube(kbCursor);
  }
});

// ---------- 面板按钮 ----------
document.getElementById("btnBack").addEventListener("click", function () { SFX.click(); goSelect(); });
document.getElementById("btnUndo").addEventListener("click", function () { undo(); });
document.getElementById("btnRestart").addEventListener("click", restartLevel);
document.getElementById("btnPlus").addEventListener("click", usePlus);
document.getElementById("btnNext").addEventListener("click", function () { SFX.click(); nextLevel(); });
document.getElementById("btnReplay").addEventListener("click", restartLevel);
document.getElementById("btnLevels").addEventListener("click", function () { SFX.click(); goSelect(); });

// ---------- 启动 ----------
loadProgress();
updateMuteLabels();
buildGrid();
setScreen("select");
fit();
requestAnimationFrame(frame);

// 调试/测试钩子（不影响游戏逻辑）
window.__ws = {
  get tubes() { return tubes; },
  get moves() { return moves; },
  get par() { return par; },
  get phase() { return phase; },
  get level() { return levelNum; },
  get selected() { return selected; },
  get animating() { return !!anim; },
  canPour: function (a, b) { return canPour(tubes, a, b); }
};
</script>
</body>
</html>
